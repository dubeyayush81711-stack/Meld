name: Debug APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --console=plain assembleFossDebug -x lint --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.meld.friends
          METROLIST_APP_NAME: Meld
      - uses: actions/upload-artifact@v4
        with:
          name: meld-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
