name: Wavy APK
on:
  push:
    branches: [wavy]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
      - run: mkdir -p ~/.android && cp .github/keys/debug.keystore ~/.android/debug.keystore
      - run: chmod +x gradlew
      - run: ./gradlew --console=plain assembleFossDebug -x lint --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.wavy.app
          METROLIST_APP_NAME: Wavy
      - uses: actions/upload-artifact@v4
        with:
          name: wavy-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
      - run: mkdir -p ~/.android && cp .github/keys/debug.keystore ~/.android/debug.keystore
      - run: chmod +x gradlew
      - run: ./gradlew --console=plain assembleFossRelease -PwavyAbi=phone -x lint --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.wavy.app
          METROLIST_APP_NAME: Wavy
      - uses: actions/upload-artifact@v4
        with:
          name: wavy-release-apk
          path: app/build/outputs/apk/foss/release/*.apk
