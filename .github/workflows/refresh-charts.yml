name: Refresh trending charts
on:
  schedule:
    - cron: "30 0 * * *"   # daily 06:00 IST
  workflow_dispatch:
  push:
    branches: [wavy]
    paths: ["backend/refresh/refresh_charts.py"]
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 backend/refresh/refresh_charts.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
