name: Wavy demo clips
on:
  workflow_dispatch:
  push:
    branches: [wavy]
    paths: [".github/demo.trigger"]
permissions:
  contents: read
  actions: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Get APK from a build run (id in .github/demo/apk_run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(tr -d ' \n' < .github/demo/apk_run)
          URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN/artifacts" | jq -r '.artifacts[]|select(.name=="wavy-release-apk")|.archive_download_url')
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -o a.zip "$URL" && unzip -o a.zip && mv app-foss-release.apk wavy.apk && ls -la wavy.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASS: ${{ secrets.DEMO_PASS }}
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: false
          script: bash .github/demo/record.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wavy-demo
          path: |
            clips
            dumps
