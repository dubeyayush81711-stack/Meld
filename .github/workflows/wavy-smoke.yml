name: Wavy emulator smoke test
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of a green Wavy APK run (uses its wavy-debug-apk artifact)"
        required: true
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wavy-debug-apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            adb logcat -c
            adb shell monkey -p com.wavy.app -c android.intent.category.LAUNCHER 1
            sleep 40
            adb exec-out screencap -p > launch.png
            adb logcat -d > logcat.txt
            adb shell pidof com.wavy.app > pid.txt || true
            if grep -q "FATAL EXCEPTION" logcat.txt; then echo CRASH > result.txt; else echo NO_CRASH > result.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wavy-smoke
          path: |
            launch.png
            logcat.txt
            pid.txt
            result.txt
