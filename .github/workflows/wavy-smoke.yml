name: Wavy emulator smoke test
on:
  push:
    branches: [wavy]
    paths: [".github/smoke.trigger"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
      - run: mkdir -p ~/.android && cp .github/keys/debug.keystore ~/.android/debug.keystore
      - run: chmod +x gradlew
      - run: ./gradlew --console=plain assembleFossDebug -x lint --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.wavy.app
          METROLIST_APP_NAME: Wavy
      - run: mkdir -p apk && cp app/build/outputs/apk/foss/debug/*.apk apk/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            adb logcat -c
            adb shell monkey -p com.wavy.app -c android.intent.category.LAUNCHER 1
            sleep 40
            adb exec-out screencap -p > launch.png
            adb logcat -d > logcat.txt
            adb shell pidof com.wavy.app > pid.txt || true
            if grep -q "FATAL EXCEPTION" logcat.txt; then echo CRASH > result.txt; else echo NO_CRASH > result.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wavy-smoke
          path: |
            launch.png
            logcat.txt
            pid.txt
            result.txt
