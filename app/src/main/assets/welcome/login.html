@keyframes shake{20%,60%{transform:translateX(-1.6cqw)}40%,80%{transform:translateX(1.6cqw)}}

/* buttons */
.btn{position:absolute;left:7.4cqw;top:138.8cqw;width:85.2cqw;height:16cqw;border:0;border-radius:8cqw;background:linear-gradient(180deg,#ff3f87,#ff2470);color:#fff;font:500 5cqw 'Poppins',sans-serif;cursor:pointer;overflow:hidden;box-shadow:0 2.4cqw 7cqw rgba(255,45,120,.4);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 52%);box-shadow:inset 0 .35cqw .5cqw rgba(255,255,255,.55),inset 0 0 0 .22cqw rgba(255,255,255,.22);pointer-events:none}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:16cqw;left:-24cqw;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:shine 4s 2.6s ease-in-out infinite}
@keyframes shine{0%{left:-24cqw}45%,100%{left:100cqw}}
.btn span{position:relative;z-index:1}
.spin{display:none;width:6cqw;height:6cqw;border:.7cqw solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;margin:auto}
.btn.load span{display:none}.btn.load .spin{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.or{position:absolute;left:7.4cqw;width:85.2cqw;top:163cqw;height:5.6cqw;display:flex;align-items:center;gap:3.4cqw;font-size:4.2cqw;color:rgba(255,255,255,.92);white-space:nowrap}
.or::before,.or::after{content:"";flex:1;height:.2cqw;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4))}.or::after{background:linear-gradient(270deg,transparent,rgba(255,255,255,.4))}
.g{position:absolute;left:42.3cqw;top:173.4cqw;width:15.5cqw;height:15.5cqw;border-radius:50%;border:.22cqw solid rgba(255,255,255,.38);background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(3cqw);backdrop-filter:blur(3cqw);box-shadow:inset 0 .3cqw .5cqw rgba(255,255,255,.3),0 2cqw 6cqw rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:transform .15s,box-shadow .2s}
.g:hover{box-shadow:inset 0 .3cqw .5cqw rgba(255,255,255,.35),0 0 5cqw rgba(255,255,255,.2)}.g:active{transform:scale(.92)}
.g svg{width:7.2cqw;height:7.2cqw}
.new{position:absolute;left:0;right:0;top:206.6cqw;text-align:center;font-size:4.2cqw}
.new button{background:none;border:0;color:var(--pink);font:600 4.2cqw 'Poppins',sans-serif;letter-spacing:.05cqw;cursor:pointer;text-transform:uppercase}
.home{position:absolute;left:40cqw;top:220cqw;width:20cqw;height:.9cqw;border-radius:1cqw;background:rgba(255,255,255,.75)}
button:focus-visible{outline:.5cqw solid #fff;outline-offset:.5cqw}
.toast{position:absolute;top:7cqw;left:50%;translate:-50% -25cqw;max-width:84cqw;padding:3cqw 6cqw;border-radius:6cqw;font-size:3.8cqw;white-space:nowrap;background:rgba(40,10,40,.55);-webkit-backdrop-filter:blur(3cqw) saturate(1.6);backdrop-filter:blur(3cqw) saturate(1.6);border:.22cqw solid rgba(255,255,255,.25);box-shadow:inset 0 .3cqw .5cqw rgba(255,255,255,.25),0 3cqw 8cqw rgba(0,0,0,.4);transition:translate .45s cubic-bezier(.2,1.2,.4,1);z-index:30}
.toast.on{translate:-50% 0}
@media(prefers-reduced-motion:reduce){*,*::after,*::before{animation-duration:.01s!important;animation-iteration-count:1!important;animation-delay:0s!important}}
</style></head>
<body>
<main class="app">
 <div class="bg"></div>
 <div class="fx"><div class="streak st1"></div><div class="streak st2"></div><div class="streak st3"></div></div>
 <canvas id="pt" class="fx"></canvas>

 <div class="icon"><svg viewBox="0 0 100 100"><defs><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ffd0e3"/></linearGradient></defs><path d="M21 32C23 56 27 72 36 72 45 72 47 52 50 44 53 52 55 72 64 72 73 72 77 56 79 32" fill="none" stroke="url(#w)" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
 <h1 class="word e" style="--d:.3s"><span id="wm"><div><i>w</i><i style="animation-delay:.15s">a</i><i style="animation-delay:.3s">v</i><i style="animation-delay:.45s">y</i></div></span></h1>

 <p class="tag e" style="--d:.45s">Your music. Your vibe.</p>
 <div class="field e" style="top:84.6cqw;--d:.55s" id="f1"><svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 8l8 6 8-6"/></svg><input id="em" type="email" autocomplete="email" placeholder=" "><label for="em">Email</label></div>
 <div class="field e" style="top:105.3cqw;--d:.65s" id="f2"><svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg><input id="pw" type="password" autocomplete="current-password" placeholder=" "><label for="pw">Password</label>
  <button class="eye" id="eye" type="button" aria-label="Show password"><svg class="open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 4.5 12 4.5 22.500 12 22.500 12 18.500 19.500 12 19.500 1.500 12 1.500 12z"/><circle cx="12" cy="12" r="3.200" fill="currentColor"/></svg><svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 4.5 12 4.5 22.500 12 22.500 12 18.500 19.500 12 19.500 1.500 12 1.500 12z"/><path d="M4 4l16 16"/></svg></button></div>

 <button class="rem on e" id="rem" type="button" style="--d:.8s"><span class="box"><svg viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg></span>Remember me</button>
 <button class="forgot e" id="fg" type="button" style="--d:.8s">Forgot password?</button>
 <button class="btn e" id="go" type="button" style="--d:.95s"><span>Sign in</span><i class="spin"></i></button>
 <div class="or e" style="--d:1.1s">or continue with</div>
 <button class="g e" id="gg" type="button" aria-label="Continue with Google" style="--d:1.2s"><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg></button>
 <p class="new e" style="--d:1.35s">New to Wavy? <button id="su" type="button">Sign up</button></p>
 <div class="home"></div>
 <div class="toast" id="tt"></div>
</main>
<script>
const $=id=>document.getElementById(id),app=document.querySelector('.app');
function fit(){const p=$('wm').parentElement;p.style.fontSize='';const b=parseFloat(getComputedStyle(p).fontSize),w=$('wm').getBoundingClientRect().width/app.getBoundingClientRect().width*app.clientWidth;p.style.fontSize=b*37.7*(app.clientWidth/100)/w+'px'}
document.fonts.ready.then(fit);addEventListener('resize',fit);fit();
let tm;function toast(m){const t=$('tt');t.textContent=m;t.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('on'),2200)}
function rip(el,e){const r=el.getBoundingClientRect(),d=Math.max(r.width,r.height)/3,s=document.createElement('span');s.className='ripple';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;el.appendChild(s);setTimeout(()=>s.remove(),600)}
$('eye').onclick=()=>{const p=$('pw'),s=p.type==='password';p.type=s?'text':'password';$('eye').classList.toggle('on',s);$('eye').setAttribute('aria-label',s?'Hide password':'Show password')};
$('rem').onclick=()=>$('rem').classList.toggle('on');
['em','pw'].forEach(i=>$(i).addEventListener('input',()=>$('f'+(i=='em'?1:2)).classList.remove('bad')));
function bad(f,m){f.classList.remove('shake');void f.offsetWidth;f.classList.add('bad','shake');toast(m)}
$('go').onclick=e=>{rip($('go'),e);const em=$('em').value.trim(),pw=$('pw').value;
 if(!/^\S+@\S+\.\S+$/.test(em))return bad($('f1'),'Enter a valid email address');
 if(pw.length<6)return bad($('f2'),'Password must be at least 6 characters');
 $('go').classList.add('load');if(window.WavyApp){WavyApp.login(em,pw,$('rem').classList.contains('on'))}else{setTimeout(()=>{$('go').classList.remove('load');toast('Welcome back to Wavy 🎧')},1400)}};
window.wavyDone=m=>{$('go').classList.remove('load');if(m)toast(m)};
['em','pw'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('go').click()}}));
$('gg').onclick=e=>{rip($('gg'),e);if(window.WavyApp){WavyApp.google()}else{toast('Continuing with Google…')}};
$('fg').onclick=()=>{if(window.WavyApp){WavyApp.forgot($('em').value.trim())}else{toast('Password reset link will be sent to your email')}};
$('su').onclick=()=>{if(window.WavyApp){const em=$('em').value.trim(),pw=$('pw').value;if(!/^\S+@\S+\.\S+$/.test(em))return bad($('f1'),'Type your email and a password above, then tap Sign up');if(pw.length<6)return bad($('f2'),'Password must be at least 6 characters');$('go').classList.add('load');WavyApp.signup(em,pw,$('rem').classList.contains('on'))}else{toast('Opening sign up…')}};
const cv=$('pt'),cx=cv.getContext('2d');let P=[],w,h;
function rs(){const d=Math.min(devicePixelRatio||1,2);w=app.clientWidth;h=app.clientHeight;cv.width=w*d;cv.height=h*d;cx.setTransform(d,0,0,d,0,0)}
function mk(i){return{x:Math.random()*w,y:i?Math.random()*h:h+10,r:(Math.random()*1.6+.6)*w/390,v:(Math.random()*.35+.12)*w/390,ph:Math.random()*6.28,c:Math.random()<.6?'255,70,150':'170,120,255',a:Math.random()*.5+.35}}
rs();P=Array.from({length:42},()=>mk(1));addEventListener('resize',rs);
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)(function L(t){cx.clearRect(0,0,w,h);for(const p of P){p.y-=p.v;p.x+=Math.sin(t/1500+p.ph)*.25;if(p.y<-10)Object.assign(p,mk(0));const k=.6+.4*Math.sin(t/500+p.ph),g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);g.addColorStop(0,'rgba('+p.c+','+p.a*k+')');g.addColorStop(1,'rgba('+p.c+',0)');cx.fillStyle=g;cx.beginPath();cx.arc(p.x,p.y,p.r*4,0,6.283);cx.fill()}requestAnimationFrame(L)})(0);
</script>
