/* logo */

.glass{position:absolute;left:6cqw;top:128cqw;width:88cqw;height:76cqw;border-radius:9cqw;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 45%,rgba(255,120,200,.07));-webkit-backdrop-filter:blur(3.4cqw) saturate(1.6);backdrop-filter:blur(3.4cqw) saturate(1.6);box-shadow:inset 0 .35cqw .5cqw rgba(255,255,255,.4),inset 0 -.3cqw .6cqw rgba(255,255,255,.08),inset 0 0 0 .22cqw rgba(255,255,255,.13),0 4cqw 10cqw rgba(0,0,0,.4);overflow:hidden;opacity:0;animation:in .9s .8s forwards}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);background-size:260% 100%;animation:sheen 7s 2s ease-in-out infinite}
@keyframes sheen{0%{background-position:160% 0}60%,100%{background-position:-60% 0}}
.cta::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 52%);box-shadow:inset 0 .35cqw .5cqw rgba(255,255,255,.6),inset 0 -.4cqw .8cqw rgba(255,255,255,.14),inset 0 0 0 .25cqw rgba(255,255,255,.25)}
.cta .t{position:relative;z-index:1}
.mark{position:relative;overflow:hidden;-webkit-backdrop-filter:blur(1cqw);backdrop-filter:blur(1cqw)}
.mark::before{content:"";position:absolute;left:0;right:0;top:0;height:52%;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.04));border-radius:2.8cqw 2.8cqw 55% 55%/2.8cqw 2.8cqw 1.4cqw 1.4cqw}
.mark b{position:relative;z-index:1}
/* text: screenshot ke exact positions */
h1{position:absolute;left:13.5cqw;top:131.8cqw;font-weight:600;font-size:7cqw;line-height:10.1cqw;white-space:nowrap;opacity:0;animation:up .8s 1s cubic-bezier(.2,.8,.2,1) forwards}
p.sub{position:absolute;left:13.3cqw;top:156.2cqw;font-weight:400;font-size:3.6cqw;line-height:6.2cqw;white-space:nowrap;color:rgba(255,255,255,.8);opacity:0;animation:up .8s 1.2s cubic-bezier(.2,.8,.2,1) forwards}
h1 span,p.sub span,.cta .t{display:block;width:max-content}
@keyframes up{from{opacity:0;transform:translateY(5cqw)}to{opacity:1;transform:none}}
@keyframes in{to{opacity:1}}
/* button */
.cta{position:absolute;left:13.3cqw;top:178.6cqw;width:48.2cqw;height:12.9cqw;border:0;border-radius:7cqw;background:linear-gradient(180deg,rgba(255,45,125,.66),rgba(200,10,95,.74));-webkit-backdrop-filter:blur(2.4cqw) saturate(1.7);backdrop-filter:blur(2.4cqw) saturate(1.7);color:#fff;font:600 4.1cqw 'Poppins',sans-serif;text-align:left;padding-left:8.4cqw;display:flex;align-items:center;cursor:pointer;overflow:hidden;box-shadow:0 2cqw 6cqw rgba(229,17,95,.35);opacity:0;animation:pop .7s 1.5s cubic-bezier(.2,1.4,.4,1) forwards,glowbtn 2.8s 2.4s ease-in-out infinite;transition:transform .15s}
.cta:active{transform:scale(.95)}
.cta:focus-visible{outline:.6cqw solid #fff;outline-offset:.6cqw}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:14cqw;left:-20cqw;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3.6s 2.6s ease-in-out infinite}
.cta svg{position:absolute;right:8.2cqw;top:50%;width:4.4cqw;height:4.4cqw;margin-top:-2.2cqw;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;animation:nudge 1.6s 2.4s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:translateY(6cqw) scale(.85)}to{opacity:1;transform:none}}
@keyframes shine{0%{left:-20cqw}45%,100%{left:70cqw}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(1.6cqw)}}
@keyframes glowbtn{0%,100%{box-shadow:0 2cqw 6cqw rgba(229,17,95,.3)}50%{box-shadow:0 2cqw 9cqw rgba(229,17,95,.6)}}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.fade{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .5s;z-index:20;display:flex;align-items:center;justify-content:center;font-size:4cqw;color:rgba(255,255,255,.7)}
.fade.on{opacity:1;pointer-events:auto}
@media(prefers-reduced-motion:reduce){*,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;animation-delay:0s!important}}

<script>
function fit(){const app=document.querySelector('.app'),W=app.clientWidth/100;

  p.style.fontSize=(base*s.dataset.w*W/w)+'px'})}
document.fonts.ready.then(fit);addEventListener('resize',fit);fit();
const cv=document.getElementById('pt'),cx=cv.getContext('2d');let P=[],w,h;
